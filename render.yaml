# Render Blueprint - deploys the Phase 2 microservices as 5 separate Render Web
# Services on the free plan, backed by one free Render Postgres database.
#
# Inter-service URLs use each service's public HTTPS address (e.g.
# https://nyom-user-service.onrender.com) rather than Render's private-network
# fromService/hostport reference. That was tried first since it's the closer
# equivalent to docker-compose.yml's internal DNS, but on this deployment the
# gateway could not reach places-service through it (confirmed: places-service
# and user-service were both healthy on their own public URLs at the same time
# the gateway's proxy to them was failing) while the public URLs work reliably.
# Traffic between services still stays on HTTPS either way.
#
# If you rename a service below, update the corresponding *_SERVICE_URL to match
# - Render's public hostname is https://<name>.onrender.com as long as that name
# isn't already taken account-wide, in which case Render appends random
# characters and you'd need to update the URL to the actual assigned one.
#
# Free-tier limitations, disclosed rather than hidden (see README "Deploying to
# Render" section for the full explanation):
#   - Render's free Postgres expires 30 days after creation (14-day grace period
#     to upgrade before deletion) and caps out at 1GB storage - fine for a class
#     project, not something to build on long-term without upgrading.
#   - The AI assistant has nothing to talk to here (Ollama isn't deployed - it
#     needs more RAM/disk than a free instance gives you) - /assistant/ask will
#     return the same "not reachable" 503 it already returns locally when Ollama
#     isn't running. Every other feature works normally.
#   - Free web services spin down after inactivity and take ~30-60s to wake back
#     up on the next request.

databases:
  - name: nyom-db
    plan: free

services:
  - name: nyom-user-service
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./services/user-service/Dockerfile
    dockerContext: ./services/user-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyom-db
          property: connectionString

  - name: nyom-places-service
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./services/places-service/Dockerfile
    dockerContext: ./services/places-service
    healthCheckPath: /health
    envVars:
      - key: USER_SERVICE_URL
        value: https://nyom-user-service.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nyom-db
          property: connectionString

  - name: nyom-recommendation-service
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./services/recommendation-service/Dockerfile
    dockerContext: ./services/recommendation-service
    healthCheckPath: /health
    envVars:
      - key: PLACES_SERVICE_URL
        value: https://nyom-places-service.onrender.com
      - key: USER_SERVICE_URL
        value: https://nyom-user-service.onrender.com

  - name: nyom-assistant-service
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./services/assistant-service/Dockerfile
    dockerContext: ./services/assistant-service
    healthCheckPath: /health
    envVars:
      - key: PLACES_SERVICE_URL
        value: https://nyom-places-service.onrender.com
      - key: USER_SERVICE_URL
        value: https://nyom-user-service.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nyom-db
          property: connectionString
      # No OLLAMA_URL on purpose - nothing free to point it at from Render. The
      # service already degrades gracefully (503 with a clear message) when
      # Ollama isn't reachable, so this is left unset rather than pointed at
      # something that doesn't exist.

  - name: nyom-gateway
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./services/gateway/Dockerfile
    dockerContext: ./services/gateway
    healthCheckPath: /health
    envVars:
      - key: USER_SERVICE_URL
        value: https://nyom-user-service.onrender.com
      - key: PLACES_SERVICE_URL
        value: https://nyom-places-service.onrender.com
      - key: RECOMMENDATION_SERVICE_URL
        value: https://nyom-recommendation-service.onrender.com
      - key: ASSISTANT_SERVICE_URL
        value: https://nyom-assistant-service.onrender.com
