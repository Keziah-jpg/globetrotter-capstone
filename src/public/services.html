<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Places - Nyom Locator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1><i class="fa-solid fa-map-location-dot"></i> Nyom Locator <span class="tag">Yaoundé</span></h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Places</a>
        <a href="login.html" id="navAuthLink">Login</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="statBar" class="stat-bar"></section>

    <section class="search assistant">
      <h2><i class="fa-solid fa-robot"></i> Ask Nyom Locator</h2>
      <div class="search-row">
        <input type="text" id="askInput" placeholder='Try: "nearest hospital", "market open now", "police station"...' onkeydown="if(event.key==='Enter')askAssistant()">
        <button class="btn-accent" onclick="askAssistant()"><i class="fa-solid fa-paper-plane"></i> Ask</button>
      </div>
      <div id="assistantReply" class="assistant-reply"></div>
    </section>

    <section class="search">
      <h2>Search All Places</h2>
      <div class="search-row">
        <input type="text" id="searchName" placeholder="Search by name, type or area...">
        <select id="searchType">
          <option value="">All Types</option>
          <option value="hospital">Hospital</option>
          <option value="clinic">Clinic</option>
          <option value="pharmacy">Pharmacy</option>
          <option value="market">Market</option>
          <option value="police">Police Station</option>
          <option value="church">Church</option>
        </select>
        <select id="searchLanguage">
          <option value="">Any Language</option>
          <option value="French">French</option>
          <option value="English">English</option>
          <option value="Ewondo">Ewondo</option>
        </select>
        <button onclick="searchServices()"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        <button class="btn-accent" onclick="findNearMe()"><i class="fa-solid fa-location-crosshairs"></i> Near Me</button>
        <button class="btn-outline" onclick="loadServices()"><i class="fa-solid fa-list"></i> Show All</button>
      </div>
    </section>

    <section id="addPlaceSection" class="form" style="display:none;">
      <h2><i class="fa-solid fa-circle-plus"></i> Add a Place</h2>
      <div class="search-row">
        <input type="text" id="newName" placeholder="Name">
        <select id="newType">
          <option value="hospital">Hospital</option>
          <option value="clinic">Clinic</option>
          <option value="pharmacy">Pharmacy</option>
          <option value="market">Market</option>
          <option value="police">Police Station</option>
          <option value="church">Church</option>
        </select>
        <input type="text" id="newAddress" placeholder="Address (e.g. Nyom II Road)">
        <input type="text" id="newContact" placeholder="Contact number">
        <input type="time" id="newOpen" value="08:00">
        <input type="time" id="newClose" value="18:00">
        <button class="btn-accent" onclick="addPlace()"><i class="fa-solid fa-plus"></i> Add Place</button>
      </div>
    </section>

    <section id="servicesList" class="card-grid"></section>
  </main>

  <footer>Nyom Locator &mdash; capstone project, health services, markets, police stations &amp; churches in Nyom, Yaoundé.</footer>

  <script src="app.js"></script>
</body>
</html>
